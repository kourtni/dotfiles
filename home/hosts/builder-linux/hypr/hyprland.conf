# --- HYPRLAND STARTER CONFIG ---

# 1. Monitors
# This auto-detects your resolution and refresh rate.
monitor=,preferred,auto,1

# 2. Executions (Autostart)
# For cleaner logouts
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP

# This starts the status bar and wallpaper tool
exec-once = waybar
exec-once = awww-daemon

# 3. Input Config
input {
    kb_layout = us
    follow_mouse = 1
    touchpad {
        natural_scroll = no
    }
}

# 4. Look and Feel
general {
    gaps_in = 5
    gaps_out = 10
    border_size = 2
    col.active_border = rgba(33ccffee) rgba(00ff99ee) 45deg
    col.inactive_border = rgba(595959aa)
    layout = dwindle
}

decoration {
    rounding = 10
    blur {
        enabled = true
        size = 3
        passes = 1
    }
}

# Float the system-monitor/network popups launched from waybar clicks
windowrule = float on, center on, size 1000 650, match:class floating-monitor

# 5. Keybindings (The Most Important Part)
$mainMod = SUPER # Sets "Windows" key as the main modifier

bind = $mainMod, Escape, exec, ~/.config/wofi/powermenu.sh  	# Power Menu
bind = $mainMod, slash, exec, ~/.config/hypr/scripts/keybinds.sh	# Show keybind cheatsheet
bind = $mainMod, B, exec, google-chrome-stable      	    	# Open Browser
bind = $mainMod, Q, exec, kitty              		    	# Open Terminal
bind = $mainMod, C, killactive,              			# Close window
bind = $mainMod, M, exec, ~/.config/hypr/scripts/logout.sh  	# Exit Hyprland (Back to Login)
bind = $mainMod, E, exec, thunar            			# Open File Manager (if installed)
bind = $mainMod, V, togglefloating,          			# Make window float
bind = $mainMod, R, exec, wofi --show drun   			# App Launcher
bind = , Print, exec, bash ~/.config/hypr/scripts/screenshot.sh full       # Save full screen screenshot and copy it
bind = SHIFT, Print, exec, bash ~/.config/hypr/scripts/screenshot.sh region # Save selected region screenshot and copy it
bind = $mainMod, P, pseudo,                  			# Toggle pseudotile (dwindle)
bind = $mainMod, J, layoutmsg, togglesplit,             	# Toggle split direction (dwindle)

# Resize active tiled window
bind = $mainMod CTRL, left,  resizeactive, -50 0	# Shrink window horizontally
bind = $mainMod CTRL, right, resizeactive,  50 0	# Grow window horizontally
bind = $mainMod CTRL, up,    resizeactive,  0 -50	# Shrink window vertically
bind = $mainMod CTRL, down,  resizeactive,  0  50	# Grow window vertically
bind = $mainMod, F, fullscreen					# Toggle fullscreen

# Move focus with mainMod + arrow keys
bind = $mainMod, left, movefocus, l	# Focus window left
bind = $mainMod, right, movefocus, r	# Focus window right
bind = $mainMod, up, movefocus, u	# Focus window up
bind = $mainMod, down, movefocus, d	# Focus window down

# Switch workspaces with mainMod + [0-9]
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# Move active window to a workspace with mainMod + SHIFT + [0-9]
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10
