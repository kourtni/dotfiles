name: Update Flake Inputs

on:
  schedule:
    # Runs every Monday at 9:00 AM UTC
    - cron: "0 9 * * 1"
  workflow_dispatch: # Allow manual triggering
  # Test changes to this workflow: runs the update and the builds, but doesn't
  # create the update PR.
  pull_request:
    paths:
      - .github/workflows/update-flake.yml

# Avoid overlapping runs racing on the same branch
concurrency:
  group: flake-update-${{ github.ref }}
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Update flake inputs
        run: nix flake update

      - name: Check for changes
        id: changes
        run: |
          # Pull request runs always validate, even if no input moved.
          if [ "${{ github.event_name }}" = pull_request ]; then
            echo "changed=true" >> $GITHUB_OUTPUT
          elif git diff --quiet flake.lock; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Setup CI user config
        if: steps.changes.outputs.changed == 'true'
        run: |
          # Create a working user-config.nix for CI builds.
          cat > user-config.nix << 'EOF'
          {
            username = "runner";
            homeDirectory = "/home/runner";
            git = {
              name = "CI Runner";
              email = "ci@example.com";
            };
            windowsUsername = "runner";
            system = "x86_64-linux";
            stateVersion = "24.11";
          }
          EOF

      # --- Validation -------------------------------------------------------
      # We build the x86_64-linux home config and the NixOS-WSL system natively.
      # We deliberately do NOT build darwin / aarch64 here: evaluating them
      # forces an import-from-derivation that must BUILD a foreign-system
      # derivation, which needs a matching runner (macOS) or emulation.

      - name: Build home config (x86_64-linux)
        if: steps.changes.outputs.changed == 'true'
        run: |
          nix build '.#homeConfigurations."runner@x86_64-linux".activationPackage' --no-link --print-build-logs

      - name: Build NixOS-WSL system
        if: steps.changes.outputs.changed == 'true'
        run: |
          nix build '.#nixosConfigurations.wsl.config.system.build.toplevel' --no-link --print-build-logs
          df -h /
      # ----------------------------------------------------------------------

      - name: Generate update summary
        if: steps.changes.outputs.changed == 'true'
        id: summary
        run: |
          {
            echo 'body<<EOF'
            echo 'Automated flake input updates.'
            echo ''
            echo '## Updated inputs'
            echo '```'
            nix flake metadata --json | jq -r '.locks.nodes | to_entries[] | select(.value.locked.rev) | "\(.key): \(.value.locked.rev[0:7])"'
            echo '```'
            echo ''
            echo '## Validated in CI (x86_64-linux runner)'
            echo '- [x] Built `homeConfigurations."*@x86_64-linux"` (native build)'
            echo '- [x] Built `nixosConfigurations.wsl` (native build)'
            echo '- [ ] darwin / aarch64 NOT validated here (needs a macOS runner)'
            echo ''
            echo '## Checklist'
            echo '- [ ] Review the changes in `flake.lock`'
            echo '- [ ] Test on WSL: `nixos-rebuild switch --sudo --flake .#wsl`'
            echo '- [ ] Test home config: `nix run .#home-manager -- switch -B "$PWD/scripts/hm-backup" --flake .#$(whoami)@x86_64-linux`'
            echo '- [ ] On a Mac: `darwin-rebuild build --flake .` if a darwin-specific change is suspected'
            echo 'EOF'
          } >> $GITHUB_OUTPUT

      - name: Create Pull Request
        if: steps.changes.outputs.changed == 'true' && github.event_name != 'pull_request'
        uses: peter-evans/create-pull-request@v8
        with:
          # Note: PRs created with GITHUB_TOKEN won't trigger other workflows.
          # Use a PAT or GitHub App token if CI checks are needed on these PRs.
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore: update flake inputs"
          title: "chore: update flake inputs"
          body: ${{ steps.summary.outputs.body }}
          branch: automated/flake-update
          delete-branch: true
          labels: dependencies
          add-paths: flake.lock
